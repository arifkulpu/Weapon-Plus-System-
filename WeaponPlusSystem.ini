[General]
; DirectInput Keyboard Scan Code (e.g. 0x26 = L, 0x1E = A, 0x2D = X)
UpgradeKey = 0x26

; Toggle weapon/shield glow effects (true/false)
EnableGlow = true

; Cost of upgrading: (CurrentLevel + 1) * GoldCostMultiplier
GoldCostMultiplier = 100

; Maximum level a weapon/shield can be upgraded to (Default: 9)
MaxUpgradeLevel = 9

[SuccessChances]
; Probability rates between 0.0 (0%) and 1.0 (100%)
ChanceLevel0 = 1.00   ; Attempting +1
ChanceLevel1 = 0.90   ; Attempting +2
ChanceLevel2 = 0.80   ; Attempting +3
ChanceLevel3 = 0.70   ; Attempting +4
ChanceLevel4 = 0.60   ; Attempting +5
ChanceLevel5 = 0.50   ; Attempting +6
ChanceLevel6 = 0.40   ; Attempting +7
ChanceLevel7 = 0.30   ; Attempting +8
ChanceLevel8 = 0.25   ; Attempting +9

[GlowColors]
; Custom glowing colors for weapon level. Format: R,G,B,Multiplier (values 0.0 to 1.0 for RGB)
GlowColor1 = 1.0, 1.0, 1.0, 1.2    ; White (+1)
GlowColor2 = 0.7, 0.8, 1.0, 2.0    ; Light Silver/Blue (+2)
GlowColor3 = 0.4, 0.6, 1.0, 2.8    ; Pale Blue (+3)
GlowColor4 = 0.2, 0.9, 0.4, 3.5    ; Pale Green (+4)
GlowColor5 = 1.0, 0.8, 0.1, 4.0    ; Gold/Yellow (+5)
GlowColor6 = 0.8, 0.2, 1.0, 4.8    ; Pink/Purple (+6)
